<div class="login-page">

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <div class="login-card">

    <div class="brand">
      <div class="brand-icon">
        📈
      </div>

      <h1>FinanceFlow</h1>

      <p>Controle financeiro inteligente</p>
    </div>

    <div class="divider"></div>

    <div class="features">

      <div class="feature">
        <span>🔒</span>
        <span>Autenticação segura via Keycloak</span>
      </div>

      <div class="feature">
        <span>🛡️</span>
        <span>Token protegido</span>
      </div>

      <div class="feature">
        <span>⚡</span>
        <span>Dashboard em tempo real</span>
      </div>

    </div>

    <button
      class="login-btn"
      (click)="login()">

      Entrar com Keycloak
    </button>

    <p class="footer-note">
      Seus dados financeiros protegidos
    </p>

  </div>

</div>
